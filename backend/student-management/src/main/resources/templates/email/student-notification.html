<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Thông báo từ nhà trường</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;color:#1e293b;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:12px;">
    <tr>
        <td style="padding:24px 28px;background:#1d4ed8;border-radius:12px 12px 0 0;color:#ffffff;">
            <h1 style="margin:0;font-size:22px;" th:text="${schoolName}">Student Management</h1>
        </td>
    </tr>
    <tr>
        <td style="padding:28px;line-height:1.7;font-size:15px;">
            <p style="margin:0 0 16px;">Xin chào <span th:text="${studentName}">bạn</span>,</p>
            <h2 style="margin:0 0 16px;font-size:19px;" th:text="${subject}">Thông báo</h2>
            <p style="margin:0;white-space:pre-line;" th:text="${body}">Nội dung thông báo</p>
        </td>
    </tr>
    <tr>
        <td style="padding:18px 28px;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.6;">
            Email thông báo được gửi từ <span th:text="${schoolName}">Student Management</span>.
        </td>
    </tr>
</table>
</body>
</html>
