<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Student Management</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:Arial,Helvetica,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:32px 12px;">
    <tr><td align="center">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td align="center" style="background:#1d4ed8;padding:28px 20px;">
                <img th:if="${logoUrl != null and !#strings.isEmpty(logoUrl)}" th:src="${logoUrl}" alt="School logo" width="64" height="64" style="display:block;margin:0 auto 12px;">
                <h1 th:text="${schoolName}" style="margin:0;color:#ffffff;font-size:23px;">Student Management</h1>
            </td></tr>
            <tr><td style="padding:32px 28px;color:#334155;font-size:15px;line-height:1.7;">
                <div th:replace="~{${contentTemplate} :: content}">Email content</div>
            </td></tr>
            <tr><td style="padding:20px;text-align:center;background:#f8fafc;color:#64748b;font-size:12px;line-height:1.6;">
                Đây là email tự động từ hệ thống Student Management.
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
