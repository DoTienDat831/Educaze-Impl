# Database connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# URL React frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Document upload limits: 25 MiB for the file, with room for multipart headers.
app.documents.max-size-bytes=${DOCUMENT_MAX_SIZE_BYTES:26214400}
app.documents.deleted-retention-days=${DOCUMENT_DELETED_RETENTION_DAYS:30}
app.documents.purge-delay-ms=${DOCUMENT_PURGE_DELAY_MS:3600000}
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:25MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:26MB}


# MinIO (replace credentials with environment variables outside local development)
app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY}
app.minio.secret-key=${MINIO_SECRET_KEY}
app.minio.bucket=${MINIO_BUCKET:student-documents}

# Authentication: supply a base64 encoded secret of at least 32 bytes and
# bootstrap credentials through the environment; never commit real values.
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-issuer=${JWT_ISSUER:educaze-api}
app.security.jwt-ttl-minutes=${JWT_TTL_MINUTES:60}
app.security.bootstrap-admin-username=${ADMIN_USERNAME:}
app.security.bootstrap-admin-password=${ADMIN_PASSWORD:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
